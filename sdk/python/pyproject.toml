[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markanm"
version = "0.1.0"
description = "Official Python SDK for MarkanM Chat Bot Platform & REST API"
readme = "README.md"
authors = [
  { name = "MarkanM Developer Team", email = "developers@markanm.com" }
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = ["markanm", "bot", "chat", "sdk", "telegram", "discord", "api", "oauth"]
dependencies = [
  "requests>=2.28.0",
  "urllib3>=1.26.0"
]

[project.urls]
Homepage = "https://chat.markanm.com/developers"
Documentation = "https://chat.markanm.com/developers/docs"
Repository = "https://github.com/markanm/markanm-python-sdk"
