<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkanM Chat — End-to-End AI & Private Messaging</title>
    <meta name="description" content="Experience private, end-to-end encrypted messaging, interactive AI anime characters, and real-time chat on MarkanM Chat." />
    <meta name="keywords" content="MarkanM, AI chat, anime character chat, private messaging, end to end encryption" />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph Social Link Preview Tags (WhatsApp, Telegram, iMessage, Discord, Facebook) -->
    <meta property="og:site_name" content="MarkanM Chat" />
    <meta property="og:title" content="MarkanM Chat — End-to-End AI & Private Messaging" />
    <meta property="og:description" content="Experience private, end-to-end encrypted messaging, interactive AI anime characters, and real-time chat on MarkanM Chat." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chat.markanm.com" />
    <meta property="og:image" content="https://chat.markanm.com/assets/og-preview.png" />
    <meta property="og:image:secure_url" content="https://chat.markanm.com/assets/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Meta Tags (Twitter / X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarkanM Chat — End-to-End AI & Private Messaging" />
    <meta name="twitter:description" content="Experience private, end-to-end encrypted messaging, interactive AI anime characters, and real-time chat on MarkanM Chat." />
    <meta name="twitter:image" content="https://chat.markanm.com/assets/og-preview.png" />
    <style>
      /* Inline fallback styles — works even if CSS bundle fails */
      body { margin: 0; background: #0B0E14; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      #mk-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0B0E14; gap: 16px; text-align: center; padding: 24px;
        transition: opacity .4s ease;
      }
      #mk-splash.hide { opacity: 0; pointer-events: none; }
      #mk-splash .spinner {
        width: 40px; height: 40px; border: 3px solid rgba(99,102,241,0.3);
        border-top-color: #6366f1; border-radius: 50%;
        animation: mk-spin .8s linear infinite;
      }
      @keyframes mk-spin { to { transform: rotate(360deg); } }
      #mk-splash .msg { font-size: 14px; color: #9ca3af; }
      #mk-splash .logo { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
      #mk-splash .logo span { color: #6366f1; }
      #mk-recovery {
        display: none; flex-direction: column; align-items: center; gap: 12px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px; padding: 24px 32px; margin-top: 8px; max-width: 340px;
      }
      #mk-recovery .title { font-size: 15px; font-weight: 700; color: #f87171; }
      #mk-recovery .desc { font-size: 12px; color: #9ca3af; line-height: 1.5; }
      #mk-recovery button {
        padding: 10px 24px; background: #6366f1; color: #fff; border: none;
        border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
        transition: background .2s;
      }
      #mk-recovery button:hover { background: #4f46e5; }
      #mk-recovery .alt { font-size: 11px; color: #6b7280; }
      #mk-recovery .alt a { color: #818cf8; text-decoration: underline; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- Splash screen: visible until React mounts -->
    <div id="mk-splash">
      <div class="logo">Markan<span>M</span> Chat</div>
      <div class="spinner"></div>
      <div class="msg">Loading...</div>
      <!-- Recovery panel — shown only if app fails to boot -->
      <div id="mk-recovery">
        <div class="title">⚠️ Something went wrong</div>
        <div class="desc">The app couldn't load. This is usually caused by a network issue or a stale browser cache.</div>
        <button onclick="mkHardReload()">🔄 Clear Cache &amp; Reload</button>
        <div class="alt">Or try <a onclick="location.reload(true)">Force Refresh</a></div>
      </div>
    </div>

    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0B0E14;color:#fff;font-family:sans-serif;text-align:center;padding:24px;">
        <div>
          <h2>JavaScript Required</h2>
          <p style="color:#9ca3af;">Please enable JavaScript in your browser to use MarkanM Chat.</p>
        </div>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // === Blank Screen Auto-Recovery ===
      // If React hasn't rendered anything into #root after 8 seconds, show recovery UI
      (function() {
        var timeout = setTimeout(function() {
          var root = document.getElementById('root');
          // Check if React mounted (root has children)
          if (!root || root.children.length === 0 || root.innerHTML.trim() === '') {
            // Show recovery panel
            var recovery = document.getElementById('mk-recovery');
            if (recovery) recovery.style.display = 'flex';
            var msg = document.querySelector('#mk-splash .msg');
            if (msg) msg.textContent = 'App failed to load';
            var spinner = document.querySelector('#mk-splash .spinner');
            if (spinner) spinner.style.display = 'none';
          }
        }, 8000);

        // Watch for React mounting — hide splash as soon as #root has content
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearTimeout(timeout);
            var splash = document.getElementById('mk-splash');
            if (splash) {
              splash.classList.add('hide');
              setTimeout(function() { splash.remove(); }, 500);
            }
            observer.disconnect();
          }
        });
        var rootEl = document.getElementById('root');
        if (rootEl) {
          observer.observe(rootEl, { childList: true, subtree: true });
        }

        // Also listen for critical load errors on script/link tags
        window.addEventListener('error', function(e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var recovery = document.getElementById('mk-recovery');
            if (recovery) recovery.style.display = 'flex';
            var msg = document.querySelector('#mk-splash .msg');
            if (msg) msg.textContent = 'Failed to load app resources';
            var spinner = document.querySelector('#mk-splash .spinner');
            if (spinner) spinner.style.display = 'none';
          }
        }, true);
      })();

      // Hard reload: clear caches and service workers, then reload
      function mkHardReload() {
        // Clear all caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        // Unregister service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(r) { r.unregister(); });
          });
        }
        // Clear localStorage cache keys (keep auth token)
        try {
          var token = localStorage.getItem('markanm_token');
          var theme = localStorage.getItem('markanm_chat_theme');
          localStorage.clear();
          if (token) localStorage.setItem('markanm_token', token);
          if (theme) localStorage.setItem('markanm_chat_theme', theme);
        } catch(e) {}
        // Force hard reload bypassing cache
        setTimeout(function() {
          location.href = location.origin + location.pathname + '?_cb=' + Date.now();
        }, 300);
      }
    </script>
  </body>
</html>
